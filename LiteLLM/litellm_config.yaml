# LiteLLM Proxy Configuration
# Documentation: https://docs.litellm.ai/docs/proxy/configs
#
# Edit this file to add your LLM models and API keys.
# This file is stored at /config/litellm/config.yaml inside Home Assistant.
#
# After editing, restart the add-on to apply changes.

model_list:
  # OpenAI example
  # - model_name: gpt-4
  #   litellm_params:
  #     model: openai/gpt-4
