worker_processes auto;
user root;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    keepalive_timeout       65;
    proxy_read_timeout      86400s;
    proxy_send_timeout      86400s;
    proxy_connect_timeout   60s;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    # Emit relative Location headers so HA-ingress redirects don't escape to
    # the addon's internal host:port (8099 / http) and get mixed-content blocked.
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Use empty prefix when called directly on :8099 (no header), so the
    # rewrites collapse to plain absolute paths and the conf still works.
    map $http_x_ingress_path $ingress_prefix { default $http_x_ingress_path; '' ""; }

    # text/html is implicit; listing other types we want rewrites to apply to
    sub_filter_types text/css text/javascript
                     application/javascript application/json application/manifest+json;
    sub_filter_once off;

    gzip off;

    server {
        listen 8099 default_server;
        server_name _;
        client_max_body_size 4G;

        # HA ingress wraps the panel in an iframe -- strip headers that block it
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # Force uncompressed upstream so sub_filter can read the body
        proxy_set_header Accept-Encoding "";

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Ingress-Path    $http_x_ingress_path;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Land the panel on the UI under the dynamic ingress prefix
        location = / { return 302 $http_x_ingress_path/ui/; }

        location / {
            proxy_pass http://127.0.0.1:4000;

            # HTML attributes
            sub_filter 'href="/'   'href="$ingress_prefix/';
            sub_filter 'src="/'    'src="$ingress_prefix/';
            sub_filter 'action="/' 'action="$ingress_prefix/';
            sub_filter "href='/"   "href='$ingress_prefix/";
            sub_filter "src='/"    "src='$ingress_prefix/";
            sub_filter "action='/" "action='$ingress_prefix/";

            # Next.js assets (HTML/JS embedded)
            sub_filter '"/_next/' '"$ingress_prefix/_next/';
            sub_filter "'/_next/" "'$ingress_prefix/_next/";
            sub_filter '(/_next/' '($ingress_prefix/_next/';

            # LiteLLM custom Next.js assetPrefix
            sub_filter '"/litellm-asset-prefix/' '"$ingress_prefix/litellm-asset-prefix/';
            sub_filter "'/litellm-asset-prefix/" "'$ingress_prefix/litellm-asset-prefix/";
            sub_filter '(/litellm-asset-prefix/' '($ingress_prefix/litellm-asset-prefix/';

            # LiteLLM UI route prefix
            sub_filter '"/ui/' '"$ingress_prefix/ui/';
            sub_filter "'/ui/" "'$ingress_prefix/ui/";
            sub_filter '"/ui"' '"$ingress_prefix/ui"';
            sub_filter "'/ui'" "'$ingress_prefix/ui'";

            # LiteLLM API endpoints called from the UI
            sub_filter '"/sso/'          '"$ingress_prefix/sso/';
            sub_filter '"/login'         '"$ingress_prefix/login';
            sub_filter '"/logout'        '"$ingress_prefix/logout';
            sub_filter '"/key/'          '"$ingress_prefix/key/';
            sub_filter '"/user/'         '"$ingress_prefix/user/';
            sub_filter '"/team/'         '"$ingress_prefix/team/';
            sub_filter '"/model/'        '"$ingress_prefix/model/';
            sub_filter '"/customer/'     '"$ingress_prefix/customer/';
            sub_filter '"/organization/' '"$ingress_prefix/organization/';
            sub_filter '"/spend/'        '"$ingress_prefix/spend/';
            sub_filter '"/spend"'        '"$ingress_prefix/spend"';
            sub_filter '"/health'        '"$ingress_prefix/health';
            sub_filter '"/global/'       '"$ingress_prefix/global/';
            sub_filter '"/v1/'           '"$ingress_prefix/v1/';
            sub_filter '"/v2/'           '"$ingress_prefix/v2/';
            sub_filter '"/chat/'         '"$ingress_prefix/chat/';
            sub_filter '"/embeddings'    '"$ingress_prefix/embeddings';
            sub_filter '"/completions'   '"$ingress_prefix/completions';
            sub_filter '"/audio/'        '"$ingress_prefix/audio/';
            sub_filter '"/files/'        '"$ingress_prefix/files/';
            sub_filter '"/batches'       '"$ingress_prefix/batches';
            sub_filter '"/cache/'        '"$ingress_prefix/cache/';
            sub_filter '"/config/'       '"$ingress_prefix/config/';
            sub_filter '"/get_image'     '"$ingress_prefix/get_image';

            # Next.js basePath / assetPrefix in __NEXT_DATA__
            sub_filter '"basePath":""'    '"basePath":"$ingress_prefix"';
            sub_filter '"assetPrefix":""' '"assetPrefix":"$ingress_prefix"';
        }
    }
}
