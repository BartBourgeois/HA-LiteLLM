worker_processes auto;
user root;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    keepalive_timeout       65;
    proxy_read_timeout      86400s;
    proxy_send_timeout      86400s;
    proxy_connect_timeout   60s;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    # Emit relative Location headers so HA-ingress redirects don't escape to
    # the addon's internal host:port (8099 / http) and get mixed-content blocked.
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Empty when called directly on :8099 (no header); the HA supervisor sets
    # this header per-request to the dynamic ingress prefix.
    map $http_x_ingress_path $ingress_prefix { default $http_x_ingress_path; '' ""; }

    # Rewrite ONLY HTML bodies. Do NOT add application/javascript/json here:
    # sub_filter is non-context-aware, and on JS bundles it corrupts object
    # keys / comparison strings / case labels that look like URL paths
    # (e.g. `let ex = {"/key/generate": "..."}` becomes `{"<prefix>/key/generate": "..."}`,
    # crashing the React app at hydration). LiteLLM's bundle already contains a
    # runtime helper that derives proxyBaseUrl from window.location.pathname,
    # so the JS doesn't need help -- we only need to rewrite paths embedded in
    # the initial HTML so the browser loads the right chunks/styles/fonts.
    sub_filter_once off;

    gzip off;

    server {
        listen 8099 default_server;
        server_name _;
        client_max_body_size 4G;

        # HA ingress wraps the panel in an iframe -- strip headers that block it
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # Force uncompressed upstream so sub_filter can read the body
        proxy_set_header Accept-Encoding "";

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Ingress-Path    $http_x_ingress_path;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Land the panel on the UI under the dynamic ingress prefix
        location = / { return 302 $http_x_ingress_path/ui/; }

        location / {
            proxy_pass http://127.0.0.1:4000;

            # HTML attribute rewrites (only applies to text/html responses --
            # the implicit default for sub_filter_types).
            sub_filter 'href="/'   'href="$ingress_prefix/';
            sub_filter 'src="/'    'src="$ingress_prefix/';
            sub_filter 'action="/' 'action="$ingress_prefix/';
            sub_filter "href='/"   "href='$ingress_prefix/";
            sub_filter "src='/"    "src='$ingress_prefix/";
            sub_filter "action='/" "action='$ingress_prefix/";

            # The RSC payload (`__next_f.push([1, "..."])` blocks inside the
            # HTML <script> tags) embeds chunk paths as JSON-escaped strings.
            # Those need prefixing too so the React Server Components payload
            # references the right asset URLs after hydration.
            sub_filter '"/_next/'                '"$ingress_prefix/_next/';
            sub_filter '"/litellm-asset-prefix/' '"$ingress_prefix/litellm-asset-prefix/';
        }
    }
}
