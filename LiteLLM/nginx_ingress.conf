worker_processes auto;
user root;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    keepalive_timeout       65;
    proxy_read_timeout      86400s;
    proxy_send_timeout      86400s;
    proxy_connect_timeout   60s;

    # Buffering ON by default. The streaming carve-out (location ~ ^/(v1/...))
    # disables it for chat/completions endpoints. Without buffering, sub_filter
    # on Next.js App Router HTML keeps the response open mid-stream and the
    # browser shows /ui/ as "pending" forever even though nginx logs 200 OK.
    proxy_buffering          on;
    proxy_buffer_size        16k;
    proxy_buffers            64 16k;
    proxy_busy_buffers_size  32k;
    proxy_max_temp_file_size 0;

    # Emit relative Location headers so HA-ingress redirects don't escape to
    # the addon's internal host:port (8099 / http) and get mixed-content blocked.
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Empty when called directly on :8099 (no header); the HA supervisor sets
    # this header per-request to the dynamic ingress prefix.
    map $http_x_ingress_path $ingress_prefix { default $http_x_ingress_path; '' ""; }

    # Be explicit: only rewrite text/html bodies. JS bundles must never be
    # touched; their object literals contain '/key/generate'-style paths that
    # would corrupt at hydration if substituted.
    sub_filter_types text/html;
    sub_filter_once off;

    gzip off;

    server {
        listen 8099 default_server;
        server_name _;
        client_max_body_size 4G;

        # HA ingress wraps the panel in an iframe -- strip headers that block it
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # HA's frontend service worker (sw-modern.js) intercepts same-origin
        # requests including this ingress iframe and aggressively caches JS
        # chunks. Past corrupted bundles get replayed from cache-storage
        # forever unless we tell the SW not to cache. The static-asset location
        # below overrides this with long-lived caching for hashed JS/CSS.
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Force uncompressed upstream so sub_filter can read the body
        proxy_set_header Accept-Encoding "";

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Ingress-Path    $http_x_ingress_path;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Land the panel on the UI under the dynamic ingress prefix
        location = / { return 302 $http_x_ingress_path/ui/; }

        # Streaming endpoints: no buffering, no sub_filter. Required so SSE
        # tokens flow through to the client incrementally instead of being
        # held until the full response completes.
        location ~ ^/(v1/(chat/completions|completions|messages)|ws) {
            proxy_pass http://127.0.0.1:4000;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Long-lived caching for content-addressed assets. Hashed Next.js
        # chunks are immutable, so a year of caching is safe and avoids
        # ~30 MB of re-download per panel open over the HA ingress tunnel.
        # No sub_filter here -- only HTML bodies need rewriting.
        location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|webp|ico|gif|map)$ {
            proxy_pass http://127.0.0.1:4000;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Default: HTML and other paths get buffered passthrough plus
        # ingress-prefix rewrites in initial-HTML attributes.
        location / {
            proxy_pass http://127.0.0.1:4000;

            # HTML attribute rewrites (only applies to text/html responses
            # via sub_filter_types text/html above).
            sub_filter 'href="/'   'href="$ingress_prefix/';
            sub_filter 'src="/'    'src="$ingress_prefix/';
            sub_filter 'action="/' 'action="$ingress_prefix/';
            sub_filter "href='/"   "href='$ingress_prefix/";
            sub_filter "src='/"    "src='$ingress_prefix/";
            sub_filter "action='/" "action='$ingress_prefix/";
        }
    }
}
