name: "LiteLLM Proxy"
version: "1.0.1"
slug: "litellm_proxy"
description: "LiteLLM proxy server - unified API gateway for multiple LLM providers"
url: "https://github.com/BartBourgeois/HA-LiteLLM"
arch:
  - amd64
  - aarch64
init: false
startup: "application"
boot: "auto"
ports:
